# Default git-cliff configuration for cliff-notes.
# Override per project by setting `git_cliff.config = "cliff.toml"` (or
# another path) in cliff-notes.toml.
#
# Reference: https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = ""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "Chores" },
  { message = "^revert", group = "Reverts" },
  { body = ".*security.*", group = "Security" },
]

filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"

# Strip conventional-commit prefix from the subject before it lands in the
# context; the LLM rewriting layer will then prettify what's left.
commit_preprocessors = [{ pattern = '^(\w+)(\(.+\))?!?: ', replace = "" }]
